[SNAPSHOT]
snapshot_interval_minutes = 10
compress_state = True

[MASKING]
masking = [
    {"regex_pattern": "blk_-?[0-9]+([ ]+blk_-?[0-9]+)*", "mask_with": "BLK"},
    {"regex_pattern": "((?<=[^A-Za-z0-9])|^)(\\d{1,3}\\.){3}\\d{1,3}(:\\d+)?([ ,]+(\\d{1,3}\\.){3}\\d{1,3}(:\\d+)?)*((?=[^A-Za-z0-9])|$)", "mask_with": "IP"},
    {"regex_pattern": "((?<=[^A-Za-z0-9])|^)([\\-\\+]?\\d+)((?=[^A-Za-z0-9])|$)", "mask_with": "NUM"}
  ]

[DRAIN]
sim_th = 0.5
depth = 4
max_children = 100
max_clusters = 1024
extra_delimiters = []

[PROFILING]
enabled = False